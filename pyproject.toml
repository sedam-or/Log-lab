[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loglab"
version = "1.0.0.dev0"
description = "Shared foundations for the LogLab student project"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1", "python-multipart==0.0.32"]

[tool.setuptools.packages.find]
where = ["src"]
