name: Parameter contract
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public contract and templates
        run: python3 scripts/check_contract.py
      - name: Test configuration checker
        run: python3 -m unittest discover -s tests -p test_contract.py -v
