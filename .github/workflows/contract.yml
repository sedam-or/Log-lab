name: Parameter contract
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public contract and templates
        run: python3 scripts/check_contract.py
      - name: Test configuration checker
        run: python3 -m unittest discover -s tests -p test_contract.py -v
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Bootstrap and test the coding environment
        run: make dev-setup
      - name: Check Source foundations
        run: make first-check ROLE=source
      - name: Check Monitor foundations
        run: make first-check ROLE=monitor
